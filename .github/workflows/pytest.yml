name: pytest
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'weldx_widgets/**'
      - '.github/workflows/pytest.yml'

jobs:
  test-pixi:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - test-py310
          - test-py311
          - test-py312
          - test-py313
          - test-py314
        weldx: [null]
        include:
          - environment: "test-py312"
            weldx: "git+https://github.com/BAMWelDX/weldx.git"
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.77.0
          environments: ${{ matrix.environment }}
          log-level: vvv
          frozen: true

      - name: Install weldx
        if: ${{ matrix.weldx != null }}
        run: pixi run --frozen -e ${{ matrix.environment }} pip install "${{matrix.weldx}}"

      - run: pixi run --frozen --environment ${{ matrix.environment }} test
